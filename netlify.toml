[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API routes: /api/status -> /.netlify/functions/status
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app fallback (must stay after the API rule)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
